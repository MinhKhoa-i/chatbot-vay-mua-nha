[project]
name = "home-loan-ai-service"
version = "0.1.0"
description = "Verified-source home loan assistant API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "SQLAlchemy[asyncio]>=2.0.36,<3",
  "cryptography>=44,<47",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pgvector>=0.3,<1",
  "pypdf>=5,<7",
  "httpx>=0.27,<1",
  "openai>=2.26,<3",
  "python-multipart>=0.0.18,<1",
  "tiktoken>=0.8,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
